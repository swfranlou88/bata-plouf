# Construit l'application sur les quatre systèmes visés et publie les archives
# dans une release GitHub. C'est exactement ce que fait outils/construire.py en
# local, lancé sur des machines que nous n'avons pas.
#
# Déclenchement : une étiquette « v1.2.3 » poussée sur le dépôt.
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# ou, depuis l'interface de GitHub, une release dont on crée l'étiquette au
# passage. Rien d'autre à préparer : l'étiquette fait la version.
#
# L'application installée chez l'utilisateur va ensuite chercher l'archive qui
# correspond à sa machine, d'après le nom du fichier.

name: Publier une version

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construire:
    name: ${{ matrix.etiquette }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Les images macOS de GitHub ne durent pas : macos-14 est retiré le
          # 2 novembre 2026 (annonce runner-images n° 13518) et macos-13 l'est
          # depuis décembre 2025 (n° 13046). On nomme la version explicitement
          # plutôt que « latest », qui change sous les pieds sans prévenir.
          - os: macos-15
            etiquette: macOS Apple Silicon
          # Dernière image Intel proposée par GitHub, annoncée jusqu'en
          # août 2027 ; après quoi il n'y aura plus de construction Intel
          # possible sur les runners hébergés.
          - os: macos-15-intel
            etiquette: macOS Intel
          - os: windows-latest
            etiquette: Windows
          - os: ubuntu-latest
            etiquette: Linux

    steps:
      - uses: actions/checkout@v5

      # Qt a besoin de ces bibliothèques même sans écran : PyInstaller importe
      # PySide6 pour l'analyser, et le dessin de l'icône instancie Qt.
      - name: Bibliothèques système
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Installer uv
        if: runner.os != 'Windows'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Installer uv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # C'est l'étiquette qui fait la version : elle est inscrite dans le code
      # avant la construction, et l'archive comme le paquet macOS la portent.
      # Auparavant il fallait penser à modifier __version__ puis à poser une
      # étiquette identique — et une étiquette posée depuis l'interface de
      # GitHub n'en laissait aucune chance.
      - name: Inscrire la version de l'étiquette
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::« $GITHUB_REF_NAME » n'est pas un numéro de version : attendu v1.2.3."
            exit 1
          fi
          # « python » sur les images Windows, « python3 » ailleurs selon les
          # versions : on prend celui qui répond.
          interprete=python
          command -v "$interprete" >/dev/null 2>&1 || interprete=python3
          "$interprete" - "$version" <<'FIN'
          import pathlib, re, sys

          version = sys.argv[1]
          fichier = pathlib.Path("bata_plouf/__init__.py")
          texte = fichier.read_text(encoding="utf-8")
          nouveau, combien = re.subn(r'__version__ = "[^"]*"',
                                     f'__version__ = "{version}"', texte, count=1)
          if combien != 1:
              raise SystemExit("__version__ introuvable dans bata_plouf/__init__.py")
          fichier.write_text(nouveau, encoding="utf-8")
          print("version inscrite :", version)
          FIN

      - name: Construire l'application
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --with pyinstaller python outils/construire.py

      - name: Déposer l'archive
        uses: actions/upload-artifact@v4
        with:
          name: archives-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publier:
    name: Publier la release
    needs: construire
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Récupérer toutes les archives
        uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true

      # La release peut déjà exister : créée à la main depuis l'interface de
      # GitHub, ou laissée par une tentative précédente. On la complète alors
      # au lieu d'échouer.
      - name: Publier les archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh archives/
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "La release $GITHUB_REF_NAME existe : on y joint les archives."
            gh release upload "$GITHUB_REF_NAME" archives/*.zip --clobber
          else
            echo "Création de la release $GITHUB_REF_NAME."
            gh release create "$GITHUB_REF_NAME" \
              --title "Bata-plouf $GITHUB_REF_NAME" \
              --generate-notes \
              archives/*.zip
          fi
